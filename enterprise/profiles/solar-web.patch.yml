# Solar 企业发行 profile patch。
#
# 应用顺序：web-app bundle → 本文件。这里按 id 覆盖或新增行。
#
# 目标：把官方「编码代理」改造成企业业务助手，并挂上 Solar 工作区。
# 企业差异只走 profile 与插件，不改官方客户端源码。

# ── 人设 ───────────────────────────────────────────────────────────────────
# 官方 web profile 的人设是编码代理，企业发行必须换掉。
- id: system-prompt
  config:
    personaPrefix: >-
      You are the Solar enterprise business assistant running inside the
      company's private agent host. You help employees finish real business
      work through the company's own business systems.
      Answer in the user's language. Be concise and concrete: state what you
      did, what you could not do, and what you need from the user.
      Never claim a business write, approval submission, or external send
      succeeded unless a tool result confirms it.
      Your readers are business users, not developers. Never show them raw
      field names, status flags, or identifiers from tool results — not
      readyForConfirmation, missingFields, awaitingInputFields, draftId,
      taskId, version numbers, or numeric status codes. Say what it means in
      business language instead: "资料齐全，可以提交了" rather than
      "readyForConfirmation: true"; "还差部门和入职日期" rather than a list of
      field keys; "草稿已更新" rather than a version number. Mention a draft
      number only because the user needs it to refer to that draft.

# ── 出口治理 ───────────────────────────────────────────────────────────────
# 企业发行不得把完整会话日志作为请求字段发送给官方 API。
- id: session-log-deepseek
  disabled: true

# 遥测与反馈不进入企业发行。
- id: desktop-product-telemetry
  disabled: true

- id: product-analytics
  disabled: true

- id: message-feedback
  disabled: true

# ── 工具面 ─────────────────────────────────────────────────────────────────
# 业务场景默认不暴露通用 Shell、任意文件系统与任意网络请求。
# 业务能力通过场景包提供的结构化工具进入，模型不能自行构造请求。
- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

- id: tool-web
  disabled: true

# ── 场景包 ─────────────────────────────────────────────────────────────────
# 场景工具把"模型能用什么"收敛成业务意图动作：先 scene_list 看可用场景，
# scene_load 载入，再 scene_invoke 调用。后台仍按用户令牌校验权限。
#
# 身份边界：Java 地址与用户令牌由宿主按会话注入环境变量，模型参数里没有
# 身份字段。
- insert:
    - id: scene-tools
      name: '../plugins/scene-tools/index.js'

# ── 客户端 ─────────────────────────────────────────────────────────────────
# Solar 工作区：每个一级菜单一个应用标签，内容用同源 iframe 承载。
- insert:
    - id: ui-solar-workspace
      name: '@ciicjx/dsh-client-ui-solar-workspace'

# HRM 建档界面：对话里的草稿卡片 + 与对话共编同一份草稿的页面。
- insert:
    - id: ui-hrm-onboarding
      name: '@ciicjx/dsh-client-ui-hrm-onboarding'
